name: terrarag

services:
  ollama:
    image: terrarag-ollama:0.40.15-maintenance
    build:
      context: ..
      dockerfile: deploy/secure/Ollama.Dockerfile
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
    security_opt:
      - no-new-privileges:true

  qdrant:
    image: terrarag-qdrant:1.20.0-maintenance
    build:
      context: ..
      dockerfile: deploy/secure/Qdrant.Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /healthz HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q healthz <&3'"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: ../backend
    restart: unless-stopped
    environment:
      LLM_MODEL: ${LLM_MODEL:-gemma4:latest}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-qwen3-embedding:0.6b}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      QDRANT_URL: http://qdrant:6333
      SQLITE_PATH: /data/terrarag.sqlite3
      REPOSITORY_ROOT: /repos
      DEBUG_LOG_CHUNKS: "false"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - api-data:/data
      - ${HOST_REPOSITORY_ROOT:-..}:/repos:ro
      - ../reference-docs:/repos/reference-docs:ro
    depends_on:
      ollama:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: ../web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://127.0.0.1:8000}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

volumes:
  api-data:
  ollama-data:
  qdrant-data:
