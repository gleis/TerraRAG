name: Maintenance
on:
  push:
  pull_request:
  schedule:
    - cron: "23 9 * * 1"
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r requirements-test.lock
      - run: pip install --no-deps -e .
      - run: pytest
      - run: pip install pip-audit
      - run: pip-audit -r requirements-test.lock --disable-pip --no-deps
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm audit --audit-level=low
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f deploy/compose.yaml up --build -d
      - run: make smoke
      - if: always()
        run: docker compose -f deploy/compose.yaml logs --tail 80
      - if: always()
        run: docker compose -f deploy/compose.yaml down --volumes
