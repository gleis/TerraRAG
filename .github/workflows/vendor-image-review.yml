name: Vendor image review
on:
  workflow_dispatch:
  push:
    branches: [maintenance/vendor-image-security, maintenance/wolfi-runtime]
concurrency:
  group: vendor-image-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  ollama:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f deploy/secure/Ollama.Dockerfile -t terrarag-ollama:review .
      - name: Exercise the libc charset boundary
        run: |
          cc -O2 -Wall -Werror deploy/secure/libc-charset-guard.c -o /tmp/libc-charset-guard
          docker run --rm --entrypoint /validation/libc-charset-guard -v /tmp/libc-charset-guard:/validation/libc-charset-guard:ro terrarag-ollama:review
      - name: Verify native backend retention and loader closure
        run: bash scripts/check-ollama-native.sh
      - run: |
          docker run -d --name ollama-check -p 127.0.0.1:11434:11434 terrarag-ollama:review
          for i in $(seq 1 60); do curl -f http://127.0.0.1:11434/api/version && break; sleep 1; done
          curl -f http://127.0.0.1:11434/api/tags
          docker exec ollama-check ollama list
          docker exec ollama-check ollama pull qwen3:0.6b
          curl -fsS http://127.0.0.1:11434/api/generate -H 'Content-Type: application/json' -d '{"model":"qwen3:0.6b","prompt":"Say OK.","think":false,"stream":false,"keep_alive":0,"options":{"num_predict":32}}' | python3 -c 'import json,sys; assert json.load(sys.stdin)["response"].strip()'
          docker exec ollama-check ollama pull qwen3-embedding:0.6b
          curl -fsS http://127.0.0.1:11434/api/embed -H 'Content-Type: application/json' -d '{"model":"qwen3-embedding:0.6b","input":"maintenance validation","keep_alive":0}' | python3 -c 'import json,sys; assert len(json.load(sys.stdin)["embeddings"][0]) > 0'
      - uses: aquasecurity/trivy-action@0.35.0
        with:
          version: v0.76.2
          image-ref: terrarag-ollama:review
          scanners: vuln
          format: json
          output: ollama-review.json
          exit-code: '1'
          ignore-unfixed: false
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ollama-review-${{ runner.arch }}
          path: ollama-review.json
      - if: always()
        run: docker logs ollama-check; docker rm -f ollama-check
  qdrant:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/secure/Qdrant.Dockerfile
          tags: terrarag-qdrant:review
          load: true
          cache-from: type=gha,scope=qdrant-security-${{ runner.arch }}
          cache-to: type=gha,mode=max,scope=qdrant-security-${{ runner.arch }}
      - run: |
          docker run -d --name qdrant-check -p 127.0.0.1:6333:6333 terrarag-qdrant:review
          for i in $(seq 1 60); do curl -f http://127.0.0.1:6333/healthz && break; sleep 1; done
          curl -f http://127.0.0.1:6333/dashboard/
          docker exec qdrant-check bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf "GET /healthz HTTP/1.0\r\n\r\n" >&3 && grep -q healthz <&3'
          docker exec qdrant-check sh -ec 'test -s /lib/apk/db/installed; ! command -v nscd'
          docker exec -e LD_BIND_NOW=1 qdrant-check /qdrant/qdrant --version
          curl -fsS http://127.0.0.1:6333/stacktrace | python3 -c 'import json,sys; assert json.load(sys.stdin)["result"]["threads"]'
          curl -f -X PUT http://127.0.0.1:6333/collections/maintenance -H 'Content-Type: application/json' -d '{"vectors":{"size":2,"distance":"Cosine"}}'
          curl -f -X PUT 'http://127.0.0.1:6333/collections/maintenance/points?wait=true' -H 'Content-Type: application/json' -d '{"points":[{"id":1,"vector":[1,0],"payload":{"source":"maintenance"}}]}'
          curl -f -X POST http://127.0.0.1:6333/collections/maintenance/points/query -H 'Content-Type: application/json' -d '{"query":[1,0],"with_payload":true}' | python3 -c 'import json,sys; assert json.load(sys.stdin)["result"]["points"][0]["id"] == 1'
      - name: Verify TLS and persistence
        run: bash scripts/qdrant-secure-smoke.sh
      - uses: aquasecurity/trivy-action@0.35.0
        with:
          version: v0.76.2
          image-ref: terrarag-qdrant:review
          scanners: vuln
          format: json
          output: qdrant-review.json
          exit-code: '1'
          ignore-unfixed: false
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qdrant-review-${{ runner.arch }}
          path: qdrant-review.json
      - if: always()
        run: docker logs qdrant-check; docker rm -f qdrant-check
